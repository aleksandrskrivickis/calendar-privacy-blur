<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calendar Privacy Blur</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="header__mark" src="icons/icon48.png" alt="" width="22" height="22" />
      <h1 class="header__title">Calendar Privacy Blur</h1>
    </header>

    <label class="toggle" for="blur-toggle">
      <span class="toggle__text">
        <span class="toggle__label">Hide event titles</span>
        <span class="toggle__status" id="status">Checking…</span>
      </span>
      <input class="toggle__input" type="checkbox" id="blur-toggle" role="switch" />
      <span class="toggle__track" aria-hidden="true"><span class="toggle__thumb"></span></span>
    </label>

    <p class="notice" id="notice" hidden></p>

    <p class="foot">
      Applies to Outlook Web calendar tabs. Nothing is collected and nothing
      leaves your browser.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
