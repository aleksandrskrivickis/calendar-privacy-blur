name: Package extension

# Builds the zip that gets uploaded to the Chrome Web Store.
#
# Called by release.yml as part of the same run rather than triggered by
# `release: published`. That event never fires for a release created with the
# default GITHUB_TOKEN, so relying on it would leave every automatic release
# without its artefact — and silently, which is the failure mode this project
# keeps running into.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Attach the zip to this release. Omit to only upload an artefact.
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the manifest
        id: manifest
        run: echo "version=$(node -p "require('./src/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        id: build
        run: |
          set -euo pipefail
          name="calendar-privacy-blur-${{ steps.manifest.outputs.version }}.zip"

          # Stage a copy so the exclusion is unambiguous and src/ is untouched.
          # src/README.md is internal maintenance notes; users never need it.
          mkdir -p dist/pkg
          cp -r src/. dist/pkg/
          rm -f dist/pkg/README.md

          (cd dist/pkg && zip -qr "../$name" .)
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # The store rejects an archive whose manifest is not at the root, and
          # that is the most common rejection cause. Fail here instead.
          unzip -Z1 "dist/$name" | grep -qx 'manifest.json' \
            || { echo "::error::manifest.json is not at the zip root"; exit 1; }

          # Nothing should ship that is not part of the extension.
          if unzip -Z1 "dist/$name" | grep -qx 'README.md'; then
            echo "::error::README.md leaked into the package"; exit 1
          fi

          echo "Packaged contents:"
          unzip -Z1 "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/${{ steps.build.outputs.name }}
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release-tag }}" "dist/${{ steps.build.outputs.name }}" --clobber
