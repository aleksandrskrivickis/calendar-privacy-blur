name: Bump version on PR

# Bumps the patch version on the pull request's own branch, so the new version
# is visible in review and arrives on main already correct.
#
# Nothing here pushes to main. That is the point: main only ever reacts to what
# has already landed, which removes the branch-protection problem and the whole
# class of partial-state failures that came with committing to main from CI.
#
# `opened` and `reopened` only — never `synchronize`, or pushing the bump would
# re-trigger this workflow. (A push with the default GITHUB_TOKEN does not start
# workflow runs, so this cannot loop regardless; limiting the types means not
# having to rely on that.)
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - "src/**"

permissions:
  contents: write

jobs:
  bump:
    # A pull request from a fork gets a read-only token, so the push would fail.
    # Skip cleanly instead; the version guard still blocks the merge.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump, unless the author already did
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main

          read_version() { node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"; }
          base="$(git show origin/main:src/manifest.json | read_version)"
          head="$(node -p "require('./src/manifest.json').version")"

          if [ "$head" != "$base" ]; then
            echo "Version already moved ($base -> $head); leaving it alone."
            exit 0
          fi

          node tools/bump-version.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.json
          git commit -m "Bump extension version to $(node -p "require('./src/manifest.json').version")"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
