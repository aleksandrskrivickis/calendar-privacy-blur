name: Release
# Without this the Actions list titles each run with the triggering commit's
# message, which on main is usually "Merge pull request #…". The version is not
# known until the bump step runs, so the title cannot carry it.
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release (manual run)' || 'Release new version' }}

# Two jobs. `release` bumps the version, commits it, and publishes a GitHub
# release with the store zip and a second zip of the listing's images and text.
# `store` then uploads that release's zip to the Chrome Web Store and submits
# it for review.
#
# Kept apart so a store failure (a submission still in review, expired
# credentials) leaves the release in place, and "Re-run failed jobs" retries
# only the upload: re-running `release` would bump the version again.
#
# Runs on main rather than in the pull request, which keeps it serialised: two
# merges cannot produce the same version, so nothing has to guard against that.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Skips its own commit. A push with the default GITHUB_TOKEN does not start
    # workflow runs anyway, so this is insurance against swapping in a PAT.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump the version and commit it
        id: bump
        run: |
          set -euo pipefail
          node tools/bump-version.mjs
          version="$(node -p "require('./src/manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $version [skip release]"
          git push

      - name: Build the store zip
        run: |
          set -euo pipefail
          name="calendar-privacy-blur-${{ steps.bump.outputs.version }}.zip"
          mkdir -p dist/pkg
          cp -r src/. dist/pkg/
          rm -f dist/pkg/README.md
          (cd dist/pkg && zip -qr "../$name" .)

          # manifest.json not at the archive root is the most common store
          # rejection; catch it here rather than days later by email.
          unzip -Z1 "dist/$name" | grep -qx 'manifest.json' \
            || { echo "::error::manifest.json is not at the zip root"; exit 1; }

      # Everything the store's listing page asks for, next to the package it
      # describes. The images are already rendered and committed by the branch
      # that merged. Keeps assets/'s layout, so LISTING.md's image links work
      # inside the zip.
      - name: Build the store assets zip
        run: |
          set -euo pipefail
          name="calendar-privacy-blur-${{ steps.bump.outputs.version }}-store-assets.zip"
          (cd assets && zip -qr "../dist/$name" LISTING.md README.md icon-128.png promo-*.png screenshots)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            "dist/calendar-privacy-blur-${{ steps.bump.outputs.version }}.zip" \
            "dist/calendar-privacy-blur-${{ steps.bump.outputs.version }}-store-assets.zip" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes

  store:
    needs: release
    runs-on: ubuntu-latest

    # Chrome Web Store credentials (see "Publishing to the Chrome Web Store" in
    # the README). Without them the upload is skipped with a notice, not failed.
    env:
      VERSION: ${{ needs.release.outputs.version }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID || 'epkaeencnloknpgpkajkjiiebllmhanb' }}

    steps:
      # The release's own commit, so the publish script and the manifest it
      # checks the version against match the zip.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The exact file attached to the release, not a rebuild of it.
      - name: Download the release's store zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern "calendar-privacy-blur-$VERSION.zip" --dir dist

      - name: Publish to the Chrome Web Store
        if: ${{ env.CWS_REFRESH_TOKEN != '' && env.CWS_PUBLISHER_ID != '' }}
        run: node tools/publish-store.mjs "dist/calendar-privacy-blur-$VERSION.zip"

      - name: Note a skipped store publish
        if: ${{ env.CWS_REFRESH_TOKEN == '' || env.CWS_PUBLISHER_ID == '' }}
        run: echo "::notice::Chrome Web Store credentials are not set; upload the release zip by hand."
