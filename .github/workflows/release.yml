name: Release

# Bumps the version, commits it, and publishes a release with the store zip.
#
# Runs on main rather than in the pull request, which keeps it serialised: two
# merges cannot produce the same version, so nothing has to guard against that.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Skips its own commit. A push with the default GITHUB_TOKEN does not start
    # workflow runs anyway, so this is insurance against swapping in a PAT.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump the version and commit it
        id: bump
        run: |
          set -euo pipefail
          node tools/bump-version.mjs
          version="$(node -p "require('./src/manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $version [skip release]"
          git push

      - name: Build the store zip
        run: |
          set -euo pipefail
          name="calendar-privacy-blur-${{ steps.bump.outputs.version }}.zip"
          mkdir -p dist/pkg
          cp -r src/. dist/pkg/
          rm -f dist/pkg/README.md
          (cd dist/pkg && zip -qr "../$name" .)

          # manifest.json not at the archive root is the most common store
          # rejection; catch it here rather than days later by email.
          unzip -Z1 "dist/$name" | grep -qx 'manifest.json' \
            || { echo "::error::manifest.json is not at the zip root"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            "dist/calendar-privacy-blur-${{ steps.bump.outputs.version }}.zip" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes
